name: Deploy frontend to GitHub Pages

# Builds the React frontend and publishes it to GitHub Pages.
# Requires: Settings -> Pages -> Source set to "GitHub Actions", and a
# Sepolia deployment committed to frontend/src/contracts/VotingSystem.json
# (run `npm run deploy:sepolia` first). Until then the guard step fails
# the run on purpose with an explanatory message.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a Sepolia deployment
        run: |
          node -e 'const d=require("./frontend/src/contracts/VotingSystem.json"); if (d.network !== "sepolia" || !/^0x[0-9a-fA-F]{40}$/.test(d.address) || /^0x0{40}$/.test(d.address)) { console.error("Deploy the contract to Sepolia and commit frontend/src/contracts/VotingSystem.json before publishing."); process.exit(1); }'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

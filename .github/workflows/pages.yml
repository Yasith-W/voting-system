name: Deploy frontend to GitHub Pages

# Builds the frontend and publishes it to GitHub Pages on push to main.
# One-time setup: Settings > Pages > Source > "GitHub Actions".
# The deploy job is skipped until a Sepolia address is committed to
# frontend/src/contracts/VotingSystem.json.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          node -e '
            const d = require("./frontend/src/contracts/VotingSystem.json");
            const ready =
              d.network === "sepolia" &&
              /^0x[0-9a-fA-F]{40}$/.test(d.address) &&
              !/^0x0{40}$/.test(d.address);
            console.log(
              ready
                ? "Sepolia deployment found (" + d.address + ") - will publish."
                : "No Sepolia deployment committed yet - skipping publish."
            );
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "ready=" + ready + "\n");
          '

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
